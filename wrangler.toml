name = "ci-transcode"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ci-transcode-store"

[[durable_objects.bindings]]
name = "JOB_REGISTRY"
class_name = "JobRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobRegistry"]

# ---- Secrets (set via `wrangler secret put <NAME>`, NOT here) ----
# GITHUB_TOKEN              - GitHub PAT (Contents: Read & write on the CI repo), used to call
#                              POST /repos/{owner}/{repo}/dispatches
# INTERNAL_CALLBACK_SECRET  - shared secret CI uses to authenticate callbacks to this Worker
# R2_ACCESS_KEY_ID          - R2 API token access key id (for presigned URLs)
# R2_SECRET_ACCESS_KEY      - R2 API token secret (for presigned URLs)

[vars]
# Non-secret configuration, safe to keep in source control.
GITHUB_OWNER = "kurashizu"
GITHUB_REPO = "ci-transcode"
R2_ACCOUNT_ID = "f1494473540307a5935f4a6a56c0d015"
R2_BUCKET_NAME = "ci-transcode-store"
DEFAULT_CRF = "40"
DEFAULT_PRESET = "4" # SVT-AV1 numeric preset, 0 (slowest/best) - 13 (fastest); 4 is a "slow"-ish balance
MAX_PARALLEL_JOBS = "10"
R2_QUOTA_BYTES = "5368709120"   # 5 GiB
JOB_TTL_SECONDS = "86400"       # 1 day
STALL_TIMEOUT_SECONDS = "21600" # 6h: if a job sits in an active CI stage (dispatching/downloading/
                                 # transcoding/uploading) with no status update for this long, sweep
                                 # treats it as a lost callback (e.g. GitHub/Worker outage) and marks
                                 # it failed so its concurrency slot isn't leaked until TTL.
UPLOAD_URL_TTL_SECONDS = "3600" # 1 hour to upload source
RESULT_URL_TTL_SECONDS = "3600" # 1 hour to download result once ready
MAX_UPLOAD_BYTES = "2147483648" # 2 GiB per-file cap, tune as needed
MAX_ESTIMATED_CI_SECONDS = "10800" # 3h: CI probes the real source (ffprobe, after download) and
                                    # estimates its own transcode time from duration/resolution/
                                    # preset; if the estimate exceeds this, CI aborts before ever
                                    # running ffmpeg rather than tying up a runner for the full
                                    # timeout-minutes budget on a config that was never going to
                                    # finish in a reasonable time.
